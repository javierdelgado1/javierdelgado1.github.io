<section class="bg-white cta" aria-labelledby="cta-heading">
  <div class="section-content cta-box">
    <h3 class="text-muted">{{ site.cta.kicker }}</h3>
    <h2 id="cta-heading">{{ site.cta.title }}</h2>
    <p class="lead">{{ site.cta.text }}</p>
    <div class="cta-actions">
      <a class="btn btn-primary" href="{{ site.cta.primaryHref }}">{{ site.cta.primaryLabel }}
        <span class="i i-after" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </span>
      </a>
      <a class="btn btn-default" href="{{ site.cta.secondaryHref }}" target="_blank" rel="noopener">{{ site.cta.secondaryLabel }}
        <span class="i i-after" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        </span>
      </a>
    </div>
  </div>
</section>
